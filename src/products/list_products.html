
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Main Store</title>

    <link href="../../assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="../../assets/css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">

    <div id="wrapper">

        <div id="content-wrapper" class="d-flex flex-column">

            <div id="content">

                <!-- TOPBAR -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

                    <span class="navbar-brand">Main Store</span>

                    <div class="ml-auto">

                        <a href="../home.php" class="btn btn-primary btn-sm">
                            <i class="fas fa-home"></i>
                            Home
                        </a>

                        <a href="../logout.php" class="btn btn-danger btn-sm">
                            <i class="fas fa-sign-out-alt"></i>
                            Logout
                        </a>

                    </div>

                </nav>

                <div class="container-fluid">

                    <h1 class="h3 mb-4 text-gray-800">Products</h1>

                    <div class="card shadow mb-4">

                        <!-- CARD HEADER -->
                        <div class="card-header py-3">

                            <div class="d-flex justify-content-between align-items-center flex-wrap">

                                <h6 class="m-0 font-weight-bold text-primary">
                                    Registered Products
                                </h6>

                                {{CREATE_PRODUCT_BUTTON}}

                            </div>

                        </div>

                        <div class="card-body">

                            <!-- SEARCH -->
                            <div class="row mb-3">

                                <div class="col-md-6">

                                    <div class="input-group">

                                        <input
                                            type="text"
                                            id="productSearch"
                                            class="form-control"
                                            placeholder="Search by product name or code..."
                                        >

                                        <div class="input-group-append">

                                            <button class="btn btn-primary" type="button">
                                                <i class="fas fa-search"></i>
                                            </button>

                                        </div>

                                    </div>

                                </div>

                            </div>

                            <!-- PRODUCTS TABLE -->
                            <div class="table-responsive">

                                <table class="table table-bordered" width="100%" cellspacing="0">

                                    <thead>
                                        {{PRODUCT_HEADERS}}
                                    </thead>

                                    <tbody>
                                        {{PRODUCT_ROWS}}
                                    </tbody>

                                </table>

                                <p id="noSearchResults" class="text-center text-gray-600 mt-3"
                                   style="display: none;">
                                    No products match your search.
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script src="../../assets/vendor/jquery/jquery.min.js"></script>
    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="../../assets/js/sb-admin-2.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const searchInput = document.getElementById('productSearch');
            const tableBody = document.querySelector('table tbody');
            const noResults = document.getElementById('noSearchResults');

            searchInput.addEventListener('input', function () {

                const search = this.value.toLowerCase().trim();

                const rows = tableBody.querySelectorAll('tr');

                let visibleRows = 0;

                rows.forEach(function (row) {

                    const name = row.cells[1]?.textContent.toLowerCase() || '';
                    const code = row.cells[2]?.textContent.toLowerCase() || '';

                    const matches = name.includes(search) || code.includes(search);

                    row.style.display = matches ? '' : 'none';

                    if (matches) {
                        visibleRows++;
                    }

                });

                noResults.style.display =
                    rows.length > 0 && visibleRows === 0 ? 'block' : 'none';

            });

        });
    </script>

</body>
</html>
