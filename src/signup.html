<!DOCTYPE html>
<html lang="en">

<head>
    

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main Store - Register User</title>

    <!-- Main Store Icon -->
    <link rel="icon" type="image/png" href="icons/main_store_icon.png">

    <!-- Font Awesome -->
    <link href="../assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">

    <!-- SB Admin 2 -->
    <link href="../assets/css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card o-hidden border-0 shadow-lg my-5">

                    <div class="card-body p-0">

                        <div class="row">

                            <div class="col-lg-12">

                                <div class="p-5">

                                    <div class="text-center">

                                        <h3 class="h4 text-gray-900 mb-4">
                                            Main Store
                                        </h3>

                                        <h3 class="h5 text-gray-900 mb-4">
                                            Register User Form
                                        </h3>

                                    </div>

                                    <form name="register-form"
                                          action="signup.php"
                                          method="post">

                                        <div class="form-group">
                                                    <input type="text"
                                                    name="fname"
                                                    class="form-control form-control-user"
                                                    placeholder="Firstname"
                                                    required>

                                        </div>

                                        <div class="form-group">

                                            <input type="text"
                                                   name="lname"
                                                   class="form-control form-control-user"
                                                   placeholder="Lastname"
                                                   required>

                                        </div>

                                        <div class="form-group">

                                            <input type="text"
                                                   name="idnumber"
                                                   class="form-control form-control-user"
                                                   placeholder="Identification Number:"
                                                   required>

                                        </div>

                                        <div class="form-group">

                                            <input type="text"
                                                   name="mphone"
                                                   class="form-control form-control-user"
                                                   placeholder="Mobile Phone"
                                                   required>

                                        </div>

                                        <div class="form-group">


                                            <input type="email"
                                                   name="email"
                                                   class="form-control form-control-user"
                                                   placeholder="E-Mail"
                                                   required>

                                        </div>

                                        <div class="form-group">

                                            <input type="password"
                                                   name="pswd"
                                                   class="form-control form-control-user"
                                                   placeholder="Password"
                                                   required>

                                        </div>

                                        <button type="submit"
                                                class="btn btn-primary btn-user btn-block">

                                            Register

                                        </button>

                                    </form>

                                    <hr>

                                    <div class="text-center">

                                        <a class="small" href="signin.html">
                                            I already have an account
                                        </a>

                                    </div>

                                    <div class="text-center">

                                        <a class="small" href="../index.html">
                                            Go to home
                                        </a>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
