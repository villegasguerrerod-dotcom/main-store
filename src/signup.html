<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Store - Register User</title>
            <link rel="icon" type="image/png" href="src/icons/main_store_icon.png">
</head>
<body>
    <label>Register User Form</label><br><br>
    <form  name="register-form" action="signup.php" method="post">
        <label>Firstname:</label><br>
        <input type="text" name="fname" placeholder="Pepito" required><br><br>
        <label>Lastname:</label><br>
        <input type="text" name="lname" placeholder="Perez" required><br><br>
        <label>Identification Number:</label><br>
        <input type="text" name="idnumber" placeholder="1234567890" required><br><br>
        <label>Mobile Phone:</label><br>
        <input type="text" name="mphhone" placeholder="3133333333" required><br><br>
        <label>E-Mail:</label><br>
        <input type="email" name="email" placeholder="alguien@mail.com" required><br><br>
        <label>Password:</label><br>
        <input type="password" name="pswd" placeholder="Algun123*" required><br><br>
        <button>Register:</button>
    </form>
</body>
</html>
